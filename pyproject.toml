[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fleet-mind"
version = "1.0.0"
description = "Collective intelligence for autonomous agent fleets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Daniel Schmidt"}
]
keywords = ["fleet", "coordination", "autonomous-agents", "swarm", "auction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies — stdlib only

[project.scripts]
fleet-demo = "fleet_mind.simulator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
